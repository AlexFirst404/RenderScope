name: Build exact Minecraft adapters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: targets
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('build_all', 'scripts/build-all.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          matrix = {'include': [{'minecraft': target['minecraft'], 'loader': target['loader'], 'artifact': target['artifact']} for target in builder.targets()]}
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
  build:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    name: ${{ matrix.loader }} / ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, test and audit exact artifact
        env:
          TARGET_MC: ${{ matrix.minecraft }}
          TARGET_LOADER: ${{ matrix.loader }}
        run: python scripts/build-all.py --minecraft "$TARGET_MC" --loader "$TARGET_LOADER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderscope-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
