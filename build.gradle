plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'dev.renderscope'
def targetLoader = providers.gradleProperty('loader').orElse('forge').get()
if (!(targetLoader in ['forge', 'neoforge'])) {
    throw new GradleException("Unsupported loader '${targetLoader}'. Use -Ploader=forge or -Ploader=neoforge.")
}
def targetLoaderName = targetLoader == 'forge' ? 'Forge' : 'NeoForge'
def targetLoaderVersion = targetLoader == 'forge' ? forge_version : neoforge_version
def targetLoaderGroup = targetLoader == 'forge' ? 'net.minecraftforge' : 'net.neoforged'
def targetDistribution = targetLoader == 'forge' ? file('distribution/forge') : file('distribution')
layout.buildDirectory = file("build/${targetLoader}")
version = "${mod_version}+mc${minecraft_version}"
base { archivesName = "renderscope-${targetLoader}" }

// Build and run with JDK 21; the legacy 1.20.1 loader scans Java 17 bytecode.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    compat {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file("run-${targetLoader}")
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            property 'renderscope.expectedLoader', targetLoaderName
            property 'renderscope.expectedLoaderVersion', targetLoaderVersion
            arg '-mixin.config=renderscope.mixins.json'
            mods { renderscope { source sourceSets.main } }
        }
        smokeClient {
            parent minecraft.runs.client
            workingDirectory project.file("run-smoke-${targetLoader}")
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            property 'renderscope.smoke.output', targetDistribution.absolutePath
            arg '-mixin.config=renderscope.mixins.json'
            args '--width', '1280', '--height', '720', '--username', 'RenderScopeQA'
            mods {
                renderscope { source sourceSets.main }
                renderscope_smoke { source sourceSets.smoke }
            }
        }
        compatClient {
            parent minecraft.runs.client
            workingDirectory project.file('run-compat-forge')
            property 'renderscope.compat.output', file('distribution/forge/compatibility').absolutePath
            args '--width', '1280', '--height', '720', '--username', 'RenderScopeQA'
            mods {
                renderscope { source sourceSets.main }
                renderscope_compat { source sourceSets.compat }
            }
        }
    }
}
repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
}
jarJar.enable()
dependencies {
    minecraft "${targetLoaderGroup}:forge:${minecraft_version}-${targetLoaderVersion}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    jarJar('io.github.llamalad7:mixinextras-forge:0.4.1') {
        jarJar.ranged(it, '[0.4.1,0.5)')
    }
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compatRuntimeOnly fg.deobf('maven.modrinth:create:8amzvn9x')
    compatRuntimeOnly fg.deobf('maven.modrinth:mekanism:uxe1WQp4')
}
mixin {
    add sourceSets.main, 'renderscope.refmap.json'
    config 'renderscope.mixins.json'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    def metadata = [version: project.version, loader_name: targetLoaderName,
                    loader_version: targetLoaderVersion, loader_version_range: "[${targetLoaderVersion},48)"]
    inputs.properties metadata
    filesMatching('META-INF/mods.toml') { expand metadata }
}
tasks.named('jar') {
    archiveClassifier = 'slim'
    manifest.attributes('MixinConfigs': 'renderscope.mixins.json',
            'Implementation-Version': project.version,
            'Implementation-Title': 'RenderScope',
            'RenderScope-Loader': targetLoader,
            'RenderScope-Loader-Version': targetLoaderVersion)
    finalizedBy 'reobfJar'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
tasks.named('build') { dependsOn 'jarJar' }

// Test fixtures are a separate artifact, never included in the client distribution.
tasks.register('compatJar', Jar) {
    from sourceSets.compat.output
    archiveClassifier = 'compat-harness'
}
reobf { compatJar {} }
tasks.named('compatJar') { finalizedBy 'reobfCompatJar' }

// A renderer assertion can stop Minecraft with exit code zero. Require fresh harness evidence too.
['runSmokeClient': ['smoke-result.json', targetDistribution],
 'runCompatClient': ['compat-result.json', file('distribution/forge/compatibility')]].each { taskName, evidence ->
    tasks.matching { it.name == taskName }.configureEach {
        def launchedAt
        doFirst {
            if (taskName == 'runCompatClient' && targetLoader != 'forge')
                throw new GradleException('The pinned Create/Mekanism compatibility suite targets Forge. Use -Ploader=forge.')
            launchedAt = System.currentTimeMillis()
        }
        doLast {
            def resultFile = new File(evidence[1] as File, evidence[0] as String)
            if (!resultFile.isFile() || resultFile.lastModified() < launchedAt)
                throw new GradleException("${taskName} did not produce fresh ${evidence[0]}")
            def result = new groovy.json.JsonSlurper().parse(resultFile)
            if (result.success != true || result.loader != targetLoaderName || result.loaderVersion != targetLoaderVersion)
                throw new GradleException("${taskName} failed: ${result.error ?: 'unexpected loader or failed checks'}")
        }
    }
}
