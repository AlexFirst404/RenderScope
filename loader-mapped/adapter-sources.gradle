def sharedProperties = new Properties()
file('../../gradle.properties').withInputStream { sharedProperties.load(it) }
def mcVersion = project.minecraftTarget
def identifierApi = mcVersion == '1.21.11'
// Exact client resource formats from each vanilla client.jar/version.json.
// Forge's example pack currently uses data formats; these are client assets.
ext.resourcePackFormat = ['1.21.9':69, '1.21.10':69, '1.21.11':75][mcVersion]
def commonJava = file('../../src/main/java').canonicalFile.toPath()
apply from: '../../modern/source-transform.gradle'
group='dev.renderscope'
version="${sharedProperties.mod_version}+mc${mcVersion}"
base { archivesName="renderscope-${targetLoader}" }
layout.buildDirectory=file("build/${mcVersion}")
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
java.withSourcesJar()
def generated=layout.buildDirectory.dir('generated/modern-adapter')
tasks.register('generateAdapterSources') {
    inputs.dir '../../modern/src/main/java'
    inputs.dir 'src/main/java'
    inputs.file '../../modern/source-transform.gradle'
    inputs.property 'minecraft',mcVersion
    outputs.dir generated
    doLast {
        ['../../modern/src/main/java','src/main/java'].each { directory ->
            fileTree(directory).matching { include '**/*.java';exclude '**/RenderScopeModern.java' }.each { source ->
                def relative=file(directory).toPath().relativize(source.toPath()).toString()
                def target=generated.get().file(relative).asFile
                target.parentFile.mkdirs()
                target.setText(transformRenderScopeSource(source.name,source.getText('UTF-8'),mcVersion),'UTF-8')
            }
        }
    }
}
sourceSets {
    main {
        java.srcDirs=[generated, '../../modern/mapped/src/main/java',
            identifierApi?'../../modern/mapped/src/gizmos/java':'../../modern/mapped/src/pipeline/java',
            "../src/${targetLoader=='neoforge'&&mcVersion=='1.21.9'?'neoforge-old':targetLoader}/java",'../../src/main/java']
        java.include 'dev/renderscope/modern/**','dev/renderscope/core/**',
            'dev/renderscope/client/ProfilerSettings.java','dev/renderscope/client/LoaderInfo.java','dev/renderscope/client/ModOwnership.java',
            'dev/renderscope/client/platform/PlatformAccess.java','dev/renderscope/client/platform/PlatformServices.java',
            'dev/renderscope/client/integration/ShaderPasses.java',"dev/renderscope/client/platform/${targetLoader=='forge'?'Forge':'NeoForge'}Platform.java"
        java.exclude { entry -> entry.file.toPath().startsWith(commonJava) && entry.path.replace('\\','/')=='dev/renderscope/client/platform/ForgePlatform.java' }
        resources.srcDirs=['../src/main/resources']
        resources.exclude targetLoader=='forge'?'META-INF/neoforge.mods.toml':'META-INF/mods.toml'
    }
    test {
        java.srcDirs=['../src/test/java','../../src/test/java/dev/renderscope/core','../../modern/src/test/java']
        java.exclude '**/ModernVanillaTargetsTest.java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('compileJava') { dependsOn tasks.named('generateAdapterSources') }
tasks.named('sourcesJar') { dependsOn tasks.named('generateAdapterSources') }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=21 }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(Jar).configureEach {
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    manifest.attributes('MixinConfigs':'renderscope.modern.mixins.json','Implementation-Title':'RenderScope',
        'Implementation-Version':project.version,'RenderScope-Loader':targetLoader,
        'RenderScope-Loader-Version':targetLoaderVersion,'RenderScope-Minecraft':mcVersion)
}
tasks.named('processResources') {
    def props=[version:project.version,minecraft_version:mcVersion,forge_version:targetLoaderVersion,
        forge_major:targetLoaderVersion.tokenize('.')[0],neo_version:targetLoaderVersion,
        resource_format:resourcePackFormat,resource_description:'RenderScope client assets']
    inputs.properties props
    filesMatching(['META-INF/mods.toml','META-INF/neoforge.mods.toml','pack.mcmeta']) { expand props }
    from('../../modern/mapped/src/main/resources/renderscope.modern.mixins.json') {
        filter { line -> line.contains('"refmap"')?'':line }
    }
    from('../../modern/src/main/resources/assets') { into 'assets' }
    from('../../src/main/resources/renderscope-logo.png') { into 'assets/renderscope' }
    from('../../src/main/resources/assets/renderscope/textures/gui/logo.png') { into 'assets/renderscope/textures/gui' }
    if (!identifierApi) from(targetLoader=='forge'?'../src/pipeline-forge/resources':'../src/pipeline/resources')
}
